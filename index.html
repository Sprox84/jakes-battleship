<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07172b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Jake's Battleship</title>
  <style>
:root {
  --bg: #07172b;
  --panel: #0d2745;
  --panel-2: #123457;
  --water: #1e79b7;
  --water-dark: #17679f;
  --line: rgba(255,255,255,.18);
  --text: #f5fbff;
  --muted: #bad9ef;
  --accent: #ffd34d;
  --green: #42d37d;
  --red: #ff5454;
  --miss: #d9ecf8;
  --ship: #74899b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% -10%, rgba(44,126,189,.38), transparent 38%),
    linear-gradient(180deg, #07172b 0%, #092441 100%);
  overscroll-behavior: none;
}
button { font: inherit; }
button:disabled { opacity: .42; }

.app {
  width: min(100%, 520px);
  margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); line-height: 1.05; }
.phase { margin: 5px 0 0; color: var(--muted); font-size: 14px; font-weight: 700; }
.icon-btn { border: 1px solid var(--line); background: rgba(255,255,255,.08); color: white; width: 44px; height: 44px; border-radius: 14px; font-size: 21px; }

.panel { background: rgba(13,39,69,.88); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.hidden { display: none !important; }

.instruction-card { background: #081e36; border-radius: 14px; padding: 11px 12px; text-align: center; margin-bottom: 10px; }
.instruction-main { font-size: 17px; font-weight: 900; }
.instruction-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

.setup-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
.secondary-btn, .secondary-wide { border: 1px solid var(--line); background: #153d66; color: white; border-radius: 12px; min-height: 43px; font-weight: 800; }
.secondary-wide { width: 100%; margin-top: 12px; }
.primary-btn { border: none; width: 100%; min-height: 50px; border-radius: 14px; background: var(--accent); color: #152132; font-weight: 1000; font-size: 17px; box-shadow: 0 5px 0 rgba(173,128,0,.55); }
.primary-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 3px 0 rgba(173,128,0,.55); }

.board-wrap { width: 100%; }
.board-label { color: #d5efff; font-size: 12px; font-weight: 1000; letter-spacing: .11em; margin: 0 0 6px 3px; }
.board-heading-row { display: flex; align-items: center; justify-content: space-between; }
.ships-left { color: var(--muted); font-size: 12px; font-weight: 800; margin-bottom: 6px; }
.board {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 2px;
  width: 100%;
  aspect-ratio: 1;
  background: #09233d;
  border: 2px solid rgba(255,255,255,.22);
  border-radius: 12px;
  padding: 3px;
  overflow: hidden;
  touch-action: manipulation;
}
.cell {
  border: 0;
  border-radius: 4px;
  background: linear-gradient(145deg, var(--water), var(--water-dark));
  color: white;
  padding: 0;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 1000;
  font-size: clamp(12px, 4.3vw, 21px);
  line-height: 1;
  position: relative;
}
.target-board .cell:not(:disabled):active { transform: scale(.90); filter: brightness(1.2); }
.cell.ship { background: linear-gradient(145deg, #8195a6, #5b7082); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
.cell.preview-ok { background: linear-gradient(145deg, #56da8c, #2eae67); }
.cell.preview-bad { background: linear-gradient(145deg, #ff7474, #d74343); }
.cell.hit { background: radial-gradient(circle, #ffcf47 0 18%, var(--red) 20% 55%, #9f2020 58% 100%); }
.cell.hit::after { content: "✹"; font-size: 1em; }
.cell.miss { background: #cfe8f6; }
.cell.miss::after { content: "•"; color: #416b86; font-size: 1.45em; transform: translateY(-5%); }
.cell.sunk { background: linear-gradient(145deg, #aa2d2d, #681c1c); }
.cell.sunk::after { content: "✹"; }

.fleet-tray { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; margin: 9px 0 10px; }
.fleet-chip { background: #081e36; border: 1px solid var(--line); border-radius: 11px; padding: 7px 8px; text-align: left; font-size: 12px; font-weight: 850; color: #d9efff; }
.fleet-chip.done { opacity: .45; text-decoration: line-through; }
.fleet-chip.active { outline: 2px solid var(--accent); color: white; }

.turn-banner { min-height: 45px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 13px; background: #081e36; font-size: 16px; font-weight: 1000; margin-bottom: 11px; padding: 8px; }
.turn-banner.hit-msg { background: #5b1d24; }
.turn-banner.good-msg { background: #123c2b; }
.enemy-wrap { margin-bottom: 12px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.compact-own { max-width: 75%; margin: 0 auto; }
.small-board .cell { font-size: clamp(9px, 3vw, 15px); }
.legend { display: flex; justify-content: center; gap: 13px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 9px; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,7,18,.82); padding: 22px; }
.modal-card { width: min(100%, 390px); background: #102f51; border: 1px solid var(--line); border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 22px 80px rgba(0,0,0,.5); animation: pop .25s ease-out; }
.modal-emoji { font-size: 64px; }
.modal h2 { font-size: 30px; margin: 8px 0 4px; }
.modal p { margin: 0 0 20px; color: var(--muted); font-size: 16px; }

@keyframes pop { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (max-height: 720px) {
  .app { padding-top: 8px; }
  .topbar { margin-bottom: 6px; }
  .panel { padding: 9px; }
  .instruction-card { padding: 8px; }
  .compact-own { max-width: 62%; }
}

</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>⚓ Jake's Battleship</h1>
        <p id="phaseText" class="phase">Place your fleet</p>
      </div>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Toggle sound">🔊</button>
    </header>

    <section id="setupPanel" class="panel setup-panel">
      <div class="instruction-card">
        <div id="shipPrompt" class="instruction-main">Place your Carrier — 5 spaces</div>
        <div class="instruction-sub">Tap a square, then use Rotate if needed.</div>
      </div>

      <div class="setup-controls">
        <button id="rotateBtn" class="secondary-btn" type="button">↻ Rotate</button>
        <button id="randomBtn" class="secondary-btn" type="button">🎲 Random</button>
        <button id="undoBtn" class="secondary-btn" type="button">↶ Undo</button>
      </div>

      <div class="board-wrap">
        <div class="board-label">YOUR OCEAN</div>
        <div id="setupBoard" class="board"></div>
      </div>

      <div id="fleetTray" class="fleet-tray"></div>
      <button id="battleBtn" class="primary-btn" type="button" disabled>⚔️ Start Battle</button>
    </section>

    <section id="battlePanel" class="panel battle-panel hidden">
      <div id="turnBanner" class="turn-banner">Your turn — fire a shot!</div>

      <div class="board-wrap enemy-wrap">
        <div class="board-heading-row">
          <div class="board-label">ENEMY OCEAN</div>
          <div id="enemyShipsLeft" class="ships-left">5 ships left</div>
        </div>
        <div id="enemyBoard" class="board target-board"></div>
      </div>

      <div class="divider"></div>

      <div class="board-wrap compact-own">
        <div class="board-heading-row">
          <div class="board-label">YOUR FLEET</div>
          <div id="playerShipsLeft" class="ships-left">5 ships left</div>
        </div>
        <div id="playerBoard" class="board small-board"></div>
      </div>

      <div class="legend"><span>💥 Hit</span><span>● Miss</span><span>🚢 Your ship</span></div>
      <button id="restartBtn" class="secondary-wide" type="button">New Game</button>
    </section>

    <section id="modal" class="modal hidden" aria-live="polite">
      <div class="modal-card">
        <div id="modalEmoji" class="modal-emoji">🏆</div>
        <h2 id="modalTitle">You win!</h2>
        <p id="modalText">You sank the whole enemy fleet.</p>
        <button id="modalButton" class="primary-btn" type="button">Play Again</button>
      </div>
    </section>
  </main>

  <script>
'use strict';

const SIZE = 10;
const SHIP_DEFS = [
  { name: 'Carrier', length: 5, icon: '🛳️' },
  { name: 'Battleship', length: 4, icon: '🚢' },
  { name: 'Cruiser', length: 3, icon: '⛴️' },
  { name: 'Submarine', length: 3, icon: '🛥️' },
  { name: 'Destroyer', length: 2, icon: '🚤' }
];

const state = {
  phase: 'setup',
  orientation: 'horizontal',
  placementIndex: 0,
  playerShips: [],
  enemyShips: [],
  playerShots: new Set(),
  enemyShots: new Set(),
  sound: true,
  turnLocked: false,
  aiTargets: []
};

const el = {
  phaseText: document.getElementById('phaseText'),
  setupPanel: document.getElementById('setupPanel'),
  battlePanel: document.getElementById('battlePanel'),
  setupBoard: document.getElementById('setupBoard'),
  enemyBoard: document.getElementById('enemyBoard'),
  playerBoard: document.getElementById('playerBoard'),
  shipPrompt: document.getElementById('shipPrompt'),
  fleetTray: document.getElementById('fleetTray'),
  rotateBtn: document.getElementById('rotateBtn'),
  randomBtn: document.getElementById('randomBtn'),
  undoBtn: document.getElementById('undoBtn'),
  battleBtn: document.getElementById('battleBtn'),
  restartBtn: document.getElementById('restartBtn'),
  soundBtn: document.getElementById('soundBtn'),
  turnBanner: document.getElementById('turnBanner'),
  enemyShipsLeft: document.getElementById('enemyShipsLeft'),
  playerShipsLeft: document.getElementById('playerShipsLeft'),
  modal: document.getElementById('modal'),
  modalEmoji: document.getElementById('modalEmoji'),
  modalTitle: document.getElementById('modalTitle'),
  modalText: document.getElementById('modalText'),
  modalButton: document.getElementById('modalButton')
};

function key(r, c) { return `${r},${c}`; }
function fromKey(k) { return k.split(',').map(Number); }
function inBounds(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

function cellsForPlacement(r, c, length, orientation) {
  return Array.from({ length }, (_, i) => [
    r + (orientation === 'vertical' ? i : 0),
    c + (orientation === 'horizontal' ? i : 0)
  ]);
}

function placementValid(cells, ships) {
  const occupied = new Set(ships.flatMap(s => s.cells.map(([r,c]) => key(r,c))));
  return cells.every(([r,c]) => inBounds(r,c) && !occupied.has(key(r,c)));
}

function makeRandomFleet() {
  const ships = [];
  for (const def of SHIP_DEFS) {
    let placed = false;
    while (!placed) {
      const orientation = Math.random() < 0.5 ? 'horizontal' : 'vertical';
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      const cells = cellsForPlacement(r, c, def.length, orientation);
      if (placementValid(cells, ships)) {
        ships.push({ ...def, orientation, cells, hits: new Set(), sunk: false });
        placed = true;
      }
    }
  }
  return ships;
}

function buildBoard(container, onTap, onHover) {
  container.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.dataset.r = r;
      btn.dataset.c = c;
      btn.setAttribute('aria-label', `Row ${r+1}, column ${c+1}`);
      if (onTap) btn.addEventListener('click', () => onTap(r,c));
      if (onHover) {
        btn.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') onHover(r,c); });
        btn.addEventListener('focus', () => onHover(r,c));
      }
      container.appendChild(btn);
    }
  }
}

function getCell(container, r, c) {
  return container.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function renderSetup() {
  [...el.setupBoard.children].forEach(cell => { cell.className = 'cell'; cell.disabled = false; });
  state.playerShips.forEach(ship => ship.cells.forEach(([r,c]) => getCell(el.setupBoard,r,c)?.classList.add('ship')));

  const def = SHIP_DEFS[state.placementIndex];
  if (def) {
    el.shipPrompt.textContent = `Place your ${def.name} — ${def.length} spaces`;
    el.battleBtn.disabled = true;
  } else {
    el.shipPrompt.textContent = 'Fleet ready! Start the battle! ⚓';
    el.battleBtn.disabled = false;
  }

  el.fleetTray.innerHTML = SHIP_DEFS.map((ship,i) => {
    const cls = i < state.placementIndex ? 'done' : (i === state.placementIndex ? 'active' : '');
    return `<div class="fleet-chip ${cls}">${ship.icon} ${ship.name} · ${ship.length}</div>`;
  }).join('');
  el.undoBtn.disabled = state.playerShips.length === 0;
}

function previewPlacement(r,c) {
  renderSetup();
  const def = SHIP_DEFS[state.placementIndex];
  if (!def) return;
  const cells = cellsForPlacement(r,c,def.length,state.orientation);
  const valid = placementValid(cells,state.playerShips);
  cells.filter(([rr,cc]) => inBounds(rr,cc)).forEach(([rr,cc]) => {
    getCell(el.setupBoard,rr,cc)?.classList.add(valid ? 'preview-ok' : 'preview-bad');
  });
}

function placeShip(r,c) {
  const def = SHIP_DEFS[state.placementIndex];
  if (!def) return;
  const cells = cellsForPlacement(r,c,def.length,state.orientation);
  if (!placementValid(cells,state.playerShips)) {
    buzz();
    flashPrompt('That ship won’t fit there. Try another spot!');
    return;
  }
  state.playerShips.push({ ...def, orientation: state.orientation, cells, hits: new Set(), sunk: false });
  state.placementIndex++;
  beep(520,.07);
  renderSetup();
}

function flashPrompt(msg) {
  const original = el.shipPrompt.textContent;
  el.shipPrompt.textContent = msg;
  setTimeout(() => { if (state.phase === 'setup') el.shipPrompt.textContent = original; }, 900);
}

function randomizePlayerFleet() {
  state.playerShips = makeRandomFleet();
  state.placementIndex = SHIP_DEFS.length;
  beep(620,.08);
  renderSetup();
}

function undoPlacement() {
  if (!state.playerShips.length) return;
  state.playerShips.pop();
  state.placementIndex = Math.max(0, state.placementIndex - 1);
  renderSetup();
}

function startBattle() {
  if (state.playerShips.length !== SHIP_DEFS.length) return;
  state.phase = 'battle';
  state.enemyShips = makeRandomFleet();
  state.playerShots.clear();
  state.enemyShots.clear();
  state.aiTargets = [];
  state.turnLocked = false;
  el.setupPanel.classList.add('hidden');
  el.battlePanel.classList.remove('hidden');
  el.phaseText.textContent = 'Battle underway';
  renderBattle();
  setBanner('Your turn — tap the enemy ocean to fire! 🎯');
}

function findShipAt(ships,r,c) {
  return ships.find(ship => ship.cells.some(([rr,cc]) => rr === r && cc === c));
}

function fireAtEnemy(r,c) {
  if (state.phase !== 'battle' || state.turnLocked) return;
  const k = key(r,c);
  if (state.playerShots.has(k)) return;
  state.turnLocked = true;
  state.playerShots.add(k);
  const ship = findShipAt(state.enemyShips,r,c);

  if (ship) {
    ship.hits.add(k);
    beep(180,.12,'square');
    if (ship.hits.size === ship.length) {
      ship.sunk = true;
      setBanner(`You sank their ${ship.name}! 🎉`, 'good-msg');
    } else {
      setBanner('HIT! 💥 Nice shot!', 'good-msg');
    }
  } else {
    beep(95,.07,'sine');
    setBanner('Miss! 🌊 Computer is firing…');
  }
  renderBattle();

  if (state.enemyShips.every(s => s.sunk)) {
    finishGame(true);
    return;
  }

  setTimeout(computerTurn, 650);
}

function computerTurn() {
  if (state.phase !== 'battle') return;
  let target = pickComputerTarget();
  const k = key(target[0],target[1]);
  state.enemyShots.add(k);
  const ship = findShipAt(state.playerShips,target[0],target[1]);

  if (ship) {
    ship.hits.add(k);
    if (ship.hits.size === ship.length) {
      ship.sunk = true;
      state.aiTargets = state.aiTargets.filter(tk => !ship.cells.some(([r,c]) => key(r,c) === tk));
      setBanner(`Oh no — your ${ship.name} was sunk! 😮`, 'hit-msg');
    } else {
      addAITargets(target[0],target[1]);
      setBanner('The computer HIT your ship! 💥', 'hit-msg');
    }
    beep(135,.12,'square');
  } else {
    setBanner('Computer missed! Your turn! 😎', 'good-msg');
    beep(500,.06,'sine');
  }
  renderBattle();

  if (state.playerShips.every(s => s.sunk)) {
    finishGame(false);
    return;
  }
  state.turnLocked = false;
}

function addAITargets(r,c) {
  const neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
  for (const [rr,cc] of neighbors) {
    const k = key(rr,cc);
    if (inBounds(rr,cc) && !state.enemyShots.has(k) && !state.aiTargets.includes(k)) state.aiTargets.push(k);
  }
}

function pickComputerTarget() {
  state.aiTargets = state.aiTargets.filter(k => !state.enemyShots.has(k));
  if (state.aiTargets.length) {
    const i = Math.floor(Math.random()*state.aiTargets.length);
    return fromKey(state.aiTargets.splice(i,1)[0]);
  }

  // Checkerboard hunt makes the opponent feel smarter without being unfair.
  let options = [];
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) {
    const k = key(r,c);
    if (!state.enemyShots.has(k) && (r+c)%2===0) options.push([r,c]);
  }
  if (!options.length) {
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (!state.enemyShots.has(key(r,c))) options.push([r,c]);
  }
  return options[Math.floor(Math.random()*options.length)];
}

function renderBattle() {
  renderEnemyBoard();
  renderPlayerBoard();
  const enemyLeft = state.enemyShips.filter(s => !s.sunk).length;
  const playerLeft = state.playerShips.filter(s => !s.sunk).length;
  el.enemyShipsLeft.textContent = `${enemyLeft} ${enemyLeft === 1 ? 'ship' : 'ships'} left`;
  el.playerShipsLeft.textContent = `${playerLeft} ${playerLeft === 1 ? 'ship' : 'ships'} left`;
}

function renderEnemyBoard() {
  [...el.enemyBoard.children].forEach(cell => {
    const r = Number(cell.dataset.r), c = Number(cell.dataset.c), k = key(r,c);
    cell.className = 'cell';
    cell.disabled = state.turnLocked || state.playerShots.has(k);
    if (state.playerShots.has(k)) {
      const ship = findShipAt(state.enemyShips,r,c);
      if (ship) cell.classList.add(ship.sunk ? 'sunk' : 'hit');
      else cell.classList.add('miss');
    }
  });
}

function renderPlayerBoard() {
  [...el.playerBoard.children].forEach(cell => {
    const r = Number(cell.dataset.r), c = Number(cell.dataset.c), k = key(r,c);
    cell.className = 'cell';
    const ship = findShipAt(state.playerShips,r,c);
    if (ship) cell.classList.add('ship');
    if (state.enemyShots.has(k)) {
      if (ship) cell.classList.add(ship.sunk ? 'sunk' : 'hit');
      else cell.classList.add('miss');
    }
    cell.disabled = true;
  });
}

function setBanner(text, cls='') {
  el.turnBanner.textContent = text;
  el.turnBanner.className = `turn-banner ${cls}`.trim();
}

function finishGame(playerWon) {
  state.phase = 'over';
  state.turnLocked = true;
  setTimeout(() => {
    el.modalEmoji.textContent = playerWon ? '🏆' : '⚓';
    el.modalTitle.textContent = playerWon ? 'You Win!' : 'Good Battle!';
    el.modalText.textContent = playerWon
      ? 'You sank the whole enemy fleet. Admiral Jake wins!'
      : 'The computer sank your fleet. Ready for a rematch?';
    el.modal.classList.remove('hidden');
    if (playerWon) victorySound();
  }, 350);
}

function resetGame() {
  state.phase = 'setup';
  state.orientation = 'horizontal';
  state.placementIndex = 0;
  state.playerShips = [];
  state.enemyShips = [];
  state.playerShots.clear();
  state.enemyShots.clear();
  state.aiTargets = [];
  state.turnLocked = false;
  el.modal.classList.add('hidden');
  el.setupPanel.classList.remove('hidden');
  el.battlePanel.classList.add('hidden');
  el.phaseText.textContent = 'Place your fleet';
  el.rotateBtn.textContent = '↻ Rotate';
  renderSetup();
}

function buzz() { if (navigator.vibrate) navigator.vibrate(50); beep(80,.06,'sawtooth'); }
function beep(freq=440, duration=.08, type='sine') {
  if (!state.sound) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(.05,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+duration);
  } catch (_) {}
}
function victorySound() { [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*130)); }

el.rotateBtn.addEventListener('click', () => {
  state.orientation = state.orientation === 'horizontal' ? 'vertical' : 'horizontal';
  el.rotateBtn.textContent = state.orientation === 'horizontal' ? '↻ Rotate' : '↕ Vertical';
  beep(440,.05);
});
el.randomBtn.addEventListener('click', randomizePlayerFleet);
el.undoBtn.addEventListener('click', undoPlacement);
el.battleBtn.addEventListener('click', startBattle);
el.restartBtn.addEventListener('click', resetGame);
el.modalButton.addEventListener('click', resetGame);
el.soundBtn.addEventListener('click', () => {
  state.sound = !state.sound;
  el.soundBtn.textContent = state.sound ? '🔊' : '🔇';
  if (state.sound) beep(520,.06);
});

buildBoard(el.setupBoard, placeShip, previewPlacement);
buildBoard(el.enemyBoard, fireAtEnemy);
buildBoard(el.playerBoard);
renderSetup();

</script>
</body>
</html>
